name: CI/CD - React App to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/

  terraform:
    runs-on: ubuntu-latest
    needs: build

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Terraform Output
        working-directory: infra
        id: tf_output
        run: terraform output -json > tf_output.json
      
      - name: Upload terraform output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-output
          path: infra/tf_output.json

  deploy-to-s3:
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist/

      - name: Download terraform output
        uses: actions/download-artifact@v4
        with:
          name: terraform-output
          path: infra

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Debug terraform output content
        run: cat infra/tf_output.json

      - name: Check cloudfront_distribution_id in tf_output.json
        run: jq '.cloudfront_distribution_id.value' infra/tf_output.json

      - name: Get CloudFront Distribution ID
        id: get_cdn_id
        run: |
          cdn_id=$(jq -r '.cloudfront_distribution_id.value' infra/tf_output.json)
          echo "Extracted CDN ID: $cdn_id"
          echo "cdn_id=$cdn_id" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://react-aws-app-bucket-charger17 --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.get_cdn_id.outputs.cdn_id }} --paths "/*"
